<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nail Salon Menu</title><style>
*{box-sizing:border-box}body{margin:0;color:#514d49;font-family:'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP',serif;background:#e9e7e2 url('1000016039.png') center top/cover fixed}.sheet{position:relative;max-width:700px;margin:100px auto 55px;background:rgba(255,255,255,.97);border-radius:75px;padding:100px 52px 65px;box-shadow:12px 15px 0 rgba(255,255,255,.6)}.tab{position:absolute;top:-100px;left:60px;width:185px;height:195px;background:#b8c9cb;border-radius:0 0 95px 95px;color:white;display:flex;align-items:flex-start;justify-content:center;padding-top:42px;font-size:46px}.tab:after{content:'✦';position:absolute;right:6px;bottom:33px;font-size:40px}h2{font-size:30px;font-weight:400;margin:0 0 18px}.rule{height:1px;background:#c3d0d0;position:relative;margin:0 0 20px}.rule:after{content:'✦';position:absolute;right:0;top:-23px;color:#b8c9cb;font-size:39px}.item{display:flex;align-items:baseline;gap:12px;padding:8px 0;font-size:21px}.name{flex:1}.dash{width:35px;border-bottom:1px solid #c3d0d0;transform:translateY(-5px)}.price{min-width:100px;text-align:left;white-space:nowrap}.section{margin-top:26px}.section .rule{margin:20px 0 25px}@media(max-width:600px){body{background-size:auto 100%}.sheet{margin:75px 15px 30px;padding:90px 20px 42px;border-radius:45px}.tab{top:-75px;left:35px;width:135px;height:150px;font-size:35px;padding-top:28px}.item{font-size:clamp(12px,3.4vw,18px);gap:6px}.dash{width:16px}.price{min-width:65px}h2{font-size:26px}}
</style></head><body><main class="sheet"><div class="tab">Menu</div><section><h2>Hand</h2><div class="rule"></div><div id="hand"></div></section><section class="section"><div class="rule"></div><h2>Foot</h2><div id="foot"></div></section><section class="section"><div class="rule"></div><h2>その他メニュー</h2><div id="other"></div></section></main><script>
const menu={hand:[['ワンカラー　ラメグラ','¥5500'],['グラデーション','¥5500'],['フレンチ','¥6600'],['デザインネイル','¥5980〜'],['お持ち込みデザイン','¥6980〜'],['補強（リペア）長さだし一本','¥550'],['全てパラジェル代込み','¥0'],['ハンドケア','¥3300'],['シェラック、クリアネイル','¥4400'],['オフのみ(ハンドフット共に)','¥3300〜'],['付け替え/当店一ヶ月以内','¥0'],['付け替え/当店一ヶ月以上','¥550'],['付け替え/他店','¥1100']],foot:[['ワンカラー','¥6000'],['足の角質（フットパック付き）','¥3300']],other:[['美眉WAX脱毛','¥4400'],['眉カット','¥2200']]};for(const [id,items] of Object.entries(menu)){document.getElementById(id).replaceChildren(...items.map(([name,price])=>{const row=document.createElement('div');row.className='item';for(const [cls,value] of [['name',name],['dash',''],['price',price]]){const el=document.createElement('span');el.className=cls;el.textContent=value;row.append(el)}return row}))}
</script></body></html>
